<section class="max-w-7xl mx-auto p-4" aria-labelledby="product-listing-heading">

  <h2 id="product-listing-heading" class="text-2xl font-bold mb-6">
    Product Listing
  </h2>

  <!-- Search & Filter -->
  <div class="flex flex-col md:flex-row gap-4 mb-6">

    <label for="search-products" class="sr-only">
      Search Products
    </label>

    <input id="search-products" type="text" placeholder="Search Products..." aria-label="Search Products"
      class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      (input)="search.set($any($event.target).value)" />

    <label for="category-filter" class="sr-only">
      Filter Products By Category
    </label>

    <select id="category-filter" aria-label="Filter Products By Category"
      class="border border-gray-300 rounded-lg px-4 py-2 md:w-64" (change)="category.set($any($event.target).value)">
      <option value="All">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Fashion">Fashion</option>
      <option value="Home">Home</option>
    </select>

  </div>

  <!-- Loading -->
  @if(loading()) {

  <div class="flex flex-col items-center justify-center min-h-[70vh]" role="status" aria-live="polite"
    aria-label="Loading products">

    <div class="relative">

      <div class="w-20 h-20 border-4 border-gray-200 rounded-full"></div>

      <div
        class="absolute top-0 left-0 w-20 h-20 border-4 border-transparent border-t-blue-600 rounded-full animate-spin"
        aria-hidden="true"></div>

    </div>

    <h3 class="mt-6 text-xl font-semibold text-gray-700">
      Loading Products...
    </h3>

    <p class="text-gray-500">
      Please wait while we fetch products
    </p>

  </div>

  }

  <!-- Products -->
  @else {

  @if(filteredProducts().length === 0){

  <div class="text-center py-10 text-gray-500" role="status" aria-live="polite">
    No Products Found
  </div>

  }

  @else {

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" role="list" aria-label="Product List">

    @for(product of filteredProducts(); track product.id){

    <article class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition" role="listitem"
      [attr.aria-labelledby]="'product-title-' + product.id">

      <img [src]="product.image" [alt]="product.name" class="w-full h-48 object-cover" decoding="async"
        fetchpriority="high" />

      <div class="p-4">

        <h3 class="text-lg font-semibold" [id]="'product-title-' + product.id">
          {{ product.name }}
        </h3>

        <p class="text-gray-500 text-sm">
          {{ product.category }}
        </p>

        <p class="text-blue-600 font-bold text-xl my-3" [attr.aria-label]="'Price ₹' + product.price">
          ₹{{ product.price }}
        </p>

        <button type="button" [attr.aria-label]="'Add ' + product.name + ' to cart'"
          class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition cursor-pointer hover:shadow-lg"
          (click)="addToCart(product)">
          Add To Cart
        </button>

      </div>

    </article>

    }

  </div>

  }

  }

</section>
